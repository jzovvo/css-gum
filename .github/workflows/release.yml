name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm run release:check

      - name: Publish to NPM
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 css-gum ${{ github.ref_name }}

            ### 📦 Installation
            ```bash
            npm install css-gum@${{ github.ref_name }}
            ```

            ### 📚 Documentation
            - [README](https://github.com/jzovvo/css-gum#readme)
            - [API Reference](https://github.com/jzovvo/css-gum#api)
            - [CHANGELOG](https://github.com/jzovvo/css-gum/blob/master/CHANGELOG.md)

            ### 🔗 Links
            - [npm package](https://www.npmjs.com/package/css-gum)
            - [GitHub repository](https://github.com/jzovvo/css-gum)
